{% extends "base.html" %}
{% load i18n %}
{% block title %}{% translate "Password changed" %}{% endblock %}
{% block body %}
<div class="login-page">
  <div class="login-card">
    <h1 class="h3 mb-3">{% translate "Password changed" %}</h1>
    <p class="text-muted">{% translate "Your password has been updated. You can now sign in." %}</p>
    <a class="btn btn-primary w-100" href="{% url 'admin:login' %}">{% translate "Return to admin login" %}</a>
  </div>
</div>
{% endblock %}
