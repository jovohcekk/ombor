{% extends "dashboard/layout.html" %}
{% load i18n %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="page-header"><h1 class="page-title">{{ title }}</h1></div>
<div class="card panel-card col-lg-6">
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      {% for field in form %}
      <div class="mb-3">
        <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
        {% for e in field.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}
      </div>
      {% endfor %}
      <button type="submit" class="btn btn-primary">{% translate "Save" %}</button>
      <a href="{% url 'dashboard:category_list' %}" class="btn btn-outline-secondary">{% translate "Cancel" %}</a>
    </form>
  </div>
</div>
{% endblock %}
