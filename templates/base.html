{% load static i18n %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE }}" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Ombor{% endblock %} | {% translate "Inventory" %}</title>
  <link rel="icon" type="image/svg+xml" href="{% static 'images/ombor-mark.svg' %}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{% static 'css/dashboard.css' %}">
  <link rel="stylesheet" href="{% static 'css/glass.css' %}">
  <script>
    (function () {
      try {
        var t = localStorage.getItem("ombor-theme");
        if (t) document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
  {% block extra_css %}{% endblock %}
</head>
<body>
{% block body %}{% endblock %}
<form class="language-dock" action="{% url 'set_language' %}" method="post">
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ request.get_full_path }}">
  <label class="visually-hidden" for="siteLanguage">{% translate "Choose language" %}</label>
  <select id="siteLanguage" name="language" class="form-select form-select-sm" aria-label="{% translate 'Choose language' %}">
    {% get_current_language as CURRENT_LANGUAGE %}
    <option value="uz" {% if CURRENT_LANGUAGE == "uz" %}selected{% endif %}>O‘zbekcha</option>
    <option value="ru" {% if CURRENT_LANGUAGE == "ru" %}selected{% endif %}>Русский</option>
    <option value="en" {% if CURRENT_LANGUAGE == "en" %}selected{% endif %}>English</option>
  </select>
  <button class="btn btn-sm btn-primary" type="submit" aria-label="{% translate 'Change language' %}">{% translate "Apply" %}</button>
</form>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{% static 'js/dashboard.js' %}"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
